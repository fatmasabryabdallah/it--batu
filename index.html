<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختيار الفرقة</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap">
  <style>
    body {
      font-family: "Cairo", sans-serif;
      background-color: #ffffff;
      color: #1e3a8a;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    /* ===== Header ===== */
    header {
      background: linear-gradient(180deg, #1e3a8a 0%, #60a5fa 100%);
      color: #fff;
      padding: 25px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .logo-section {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .logo-section img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
    }

    .department-name {
      font-size: 1.4rem;
      font-weight: 700;
    }

    /* ===== Select Container ===== */
    .select-container {
      margin-top: 80px;
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 25px;
      border-radius: 20px;
      width: 85%;
      max-width: 450px;
      margin-inline: auto;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s;
    }

    .select-container:hover {
      transform: translateY(-5px);
    }

    .select-container h3 {
      margin-bottom: 25px;
      font-size: 1.3rem;
      color: #1e3a8a;
    }

    select {
      padding: 12px 15px;
      border-radius: 12px;
      border: 2px solid #1e3a8a;
      width: 100%;
      font-size: 1.1rem;
      background: #e0f2fe;
      color: #1e3a8a;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
    }

    select:hover {
      background-color: #f1f5f9;
    }

    button {
      margin-top: 25px;
      padding: 12px 30px;
      font-size: 1.1rem;
      border-radius: 10px;
      border: none;
      background: linear-gradient(180deg, #1e3a8a 0%, #60a5fa 100%);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      .select-container {
        width: 90%;
        padding: 30px 15px;
      }

      select, button {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo-section">
      <img src="images/uni_logo.png" alt="Logo 1">
      <img src="images/kolya_logo.png" alt="Logo 2" class="main-logo">
      <img src="images/dep_logo.png" alt="Logo 3">
    </div>
    <h2 class="department-name">قسم تكنولوجيا المعلومات</h2>
  </header>

  <!-- Select Year -->
  <div class="select-container">
    <h3>👋 أهلاً بك! من فضلك اختر الفرقة الدراسية</h3>
    <select id="yearSelect" title="اختيار الفرقة الدراسية">
      <option value="">-- اختار الفرقة --</option>
      <option value="year1">الفرقة الأولى</option>
      <option value="year2">الفرقة الثانية</option>
      <option value="year3">الفرقة الثالثة</option>
      <option value="year4">الفرقة الرابعة</option>
    </select>
    <button onclick="goToDashboard()">تأكيد</button>
  </div>

  <script>
    function goToDashboard() {
      const year = document.getElementById('yearSelect').value;
      if (year) {
        localStorage.setItem('selectedYear', year);
        window.location.href = "dashboard.html";
      } else {
        alert("من فضلك اختار الفرقة أولًا");
      }
    }
  </script>

  <footer>
    <p>© 2025 جامعة برج العرب التكنولوجية - قسم تكنولوجيا المعلومات</p>
    <p>تم انشاء هذا الموقع بواسطه Fatma Sabry Abdallah</p>
  </footer>
</body>
</html>
