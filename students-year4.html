<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قوائم الفرقة الرابعة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body {
  font-family:'Cairo',sans-serif;
  background-color:#e6f7f5;
  color: #1e3a8a;
  text-align:center;
  overflow-x:hidden;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== Header ===== */
header {
  background:linear-gradient(135deg,#00bfa5,#26c6da,#4dd0e1);
  color:#fff;
  padding:25px 10px 35px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
  position:relative;
}
.back-btn {
  position:absolute;
  left:15px; top:15px;
  background-color:rgba(255,255,255,0.15);
  border:none; color:white;
  font-size:20px; border-radius:50%;
  width:42px; height:42px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all 0.3s ease; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.back-btn:hover {background-color:rgba(255,255,255,0.3); transform:scale(1.1);}

/* ===== Container ===== */
.container {
  width:90%;
  max-width:1000px;
  margin:30px auto 80px auto;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* ===== Cards ===== */
.card {
  background:#fff;
  border-radius:15px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  overflow:hidden;
  transition:all 0.3s ease;
}
.card-header {
  padding:18px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color: #1e3a8a;
}
.card-header.software {background:#e3f2fd;}
.card-header.network {background:#f5f5f5;}
.card-header i {transition:transform 0.4s ease;}
.card.active .card-header i {transform:rotate(180deg);}
.card-content {
  max-height:0;
  overflow:hidden;
  transition:max-height 0.5s ease, padding 0.3s ease;
  background:#f1fcfc;
  padding:0 15px;
}
.card.active .card-content {
  max-height:1000px;
  padding:15px;
}

/* ===== PDF Viewer ===== */
.pdf-container {
  width:100%;
  height:75vh;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  background:#fff;
}
.pdf-container iframe {
  width:100%;
  height:100%;
  border:none;
}

/* ===== Footer ===== */
footer {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#e6f7f5;
  color: #1e3a8a;
  text-align:center;
  padding:10px 0;
  font-size:14px;
  border-top:1px solid #c8e6e4;
  box-shadow:0 -2px 8px rgba(0,0,0,0.05);
  z-index:10;
}
</style>
</head>

<body>
<header>
  <button class="back-btn" onclick="goBack()" title="العودة إلى لوحة القسم"><i class="fas fa-arrow-right"></i></button>
  <div class="department-name">قسم تكنولوجيا المعلومات</div>
  <div class="year-label">قوائم الفرقة الرابعة</div>
</header>

<div class="container">
  <!-- Software Section -->
  <div class="card">
    <div class="card-header software">
      <span>📘 Software Engineering</span>
      <i class="fas fa-chevron-down"></i>
    </div>
    <div class="card-content">
      <div class="pdf-container">
        <iframe src="pdfs/قوائم الفرقة الرابعة - Software.pdf" title="قوائم الفرقة الرابعة - Software"></iframe>
      </div>
    </div>
  </div>

  <!-- Network Section -->
  <div class="card">
    <div class="card-header network">
      <span>💻 Network Engineering</span>
      <i class="fas fa-chevron-down"></i>
    </div>
    <div class="card-content">
      <div class="pdf-container">
        <iframe src="pdfs/قوائم الفرقة الرابعة - Network.pdf" title="قوائم الفرقة الرابعة - Network"></iframe>
      </div>
    </div>
  </div>
</div>

<footer>© 2025 جامعة برج العرب التكنولوجية - قسم تكنولوجيا المعلومات</footer>
<footer>©تم انشاء هذا الموقع بواسطه Fatma Sabry Abdallah</footer>
<script>
const cards = document.querySelectorAll(".card");
cards.forEach(card=>{
  card.querySelector(".card-header").addEventListener("click",()=>{
    cards.forEach(c=>{ if(c!==card) c.classList.remove("active"); });
    card.classList.toggle("active");
  });
});

function goBack(){
  window.location.href="dashboard.html";
}
</script>

</body>
</html>
