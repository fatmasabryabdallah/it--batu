<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قوائم الفرقة الأولى</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* {margin:0; padding:0; box-sizing:border-box;}
body {
  font-family:'Cairo',sans-serif;
  background-color:#e6f7f5;
  color: #1e3a8a;
  text-align:center;
  overflow-x:hidden;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== Header ===== */
header {
  background:linear-gradient(135deg,#00bfa5,#26c6da,#4dd0e1);
  color:#fff;
  padding:25px 10px 35px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  box-shadow:0 6px 20px rgba(0,0,0,0.1);
  position:relative;
}

.logos {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-bottom: 5px;
}
.logos img {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border-radius: 8px;
}
.back-btn {
  position:absolute;
  left:15px; top:15px;
  background-color:rgba(255,255,255,0.15);
  border:none; color:white;
  font-size:20px; border-radius:50%;
  width:42px; height:42px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all 0.3s ease; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
}
.back-btn:hover {background-color:rgba(255,255,255,0.3); transform:scale(1.1);}

/* ===== Layout ===== */
.main-container {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items: center; /* Vertically align items */
  gap:25px;
  margin:30px auto 80px auto;
  width:95%;
}

/* ===== PDF Container ===== */
.pdf-container {
  flex:1 1 45%;
  max-width:600px;
  height:80vh;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  background-color:#fff;
}
.pdf-container iframe {
  width:100%;
  height:100%;
  border:none;
}

/* ===== Telegram Section ===== */
.telegram-section {
  flex:1 1 45%;
  max-width:500px;
  background:#fff;
  border-radius:15px;
  padding:40px 20px;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  text-align:center;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 300px; /* Give it some height */
}

.telegram-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-decoration: none;
  color: #0088cc; /* Telegram's brand color */
  font-size: 1.5rem;
  font-weight: 600;
  transition: transform 0.3s ease, color 0.3s ease;
}

.telegram-link:hover {
  transform: scale(1.05);
  color: #00a0e9;
}

.telegram-link i {
  font-size: 90px;
}

/* ===== Footer ===== */
footer {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#e6f7f5;
  color: #1e3a8a;
  text-align:center;
  padding:10px 0;
  font-size:14px;
  border-top:1px solid #c8e6e4;
  box-shadow:0 -2px 8px rgba(0,0,0,0.05);
  z-index:10;
}
</style>
</head>

<body>
<header>
  <button class="back-btn" onclick="goBack()" title="العودة إلى لوحة القسم"><i class="fas fa-arrow-right"></i></button>
  <div class="logos">
    <img src="images/uni_logo.png" alt="Logo1" />
    <img src="images/kolya_logo.png" alt="Logo2" />
    <img src="images/dep_logo.png" alt="Logo3" />
  </div>
  <h1>قسم تكنولوجيا المعلومات</h1>
  <h3>قوائم الفرقة الأولى</h3>
</header>

<div class="main-container">
  <!-- <div class="pdf-container">
    <iframe src="pdfs/قوائم الفرقه الاولى.pdf" title="قوائم الفرقة الأولى"></iframe>
  </div> -->

  <div class="telegram-section">
      <a href="https://t.me/+g8IF6GMRg90yM2Rk" target="_blank" rel="noopener" class="telegram-link">
          <i class="fab fa-telegram"></i>
          <span>انضم إلى قناة الفرقة الأولى</span>
      </a>
  </div>
</div>

<footer>
  <p>© 2025 جامعة برج العرب التكنولوجية - قسم تكنولوجيا المعلومات</p>
  <p>تم انشاء هذا الموقع بواسطه Fatma Sabry Abdallah</p>
</footer>
<script>
function goBack() {
  window.location.href = "dashboard.html";
}
</script>
</body>
</html>
