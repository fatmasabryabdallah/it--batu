<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الجدول الدراسي</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-color, #ffffff);
      color: #1e3a8a;
      text-align: center;
      transition: background-color 0.6s ease;
    }

    /* ===== Header ===== */
    header {
      background: var(--header-gradient, linear-gradient(135deg, #00bfa5, #26c6da, #4dd0e1));
      color: #fff;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .department-name { font-size: 1.5rem; font-weight: bold; }
    .year-label { font-size: 1.1rem; opacity: 0.9; }

    /* ===== Logos ===== */
    .logos {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 10px;
    }
    .logos img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* ===== Buttons ===== */
    .btn {
      margin: 10px 5px;
      padding: 10px 25px;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-back {
      background-color: #ff9800;
      color: #fff;
    }
    .btn-back:hover { background-color: #fb8c00; }
    .btn-download {
      background-color: #4caf50;
      color: #fff;
    }
    .btn-download:hover { background-color: #43a047; }

    /* ===== PDF Container ===== */
    .pdf-container {
      width: 90%;
      max-width: 900px;
      height: 80vh;
      margin: 30px auto;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      background-color: #fff;
    }
    .pdf-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logos">
      <img src="images/uni_logo.png" alt="Logo1" />
      <img src="images/kolya_logo.png" alt="Logo2" />
      <img src="images/dep_logo.png" alt="Logo3" />
    </div>
    <div class="department-name">قسم تكنولوجيا المعلومات</div>
    <div class="year-label" id="yearLabel"></div>
  </header>

  <!-- Buttons -->
  <div>
    <button class="btn btn-back" onclick="goBack()">← رجوع</button>
    <a href="pdfs/%D8%AC%D8%AF%D9%88%D9%84%20%D8%A7%D9%84%D9%81%D8%B1%D9%82%D9%87%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%D9%87.pdf" download>
      <button class="btn btn-download"><i class="fas fa-download"></i> تحميل الجدول (PDF)</button>
    </a>
    <p style="font-size: 0.9rem; color: #666; margin-top: 5px;">إذا لم يظهر الجدول أدناه، يرجى الضغط على زر التحميل.</p>
  </div>

  <!-- PDF -->
  <div class="pdf-container">
    <iframe src="pdfs/%D8%AC%D8%AF%D9%88%D9%84%20%D8%A7%D9%84%D9%81%D8%B1%D9%82%D9%87%20%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A%D9%87.pdf" title="جدول الفرقة الثانية"></iframe>
  </div>

  <script>
    const year = localStorage.getItem('selectedYear');
    const yearLabel = document.getElementById('yearLabel');

    let yearName = '';
    let bgColor = '';
    let headerGradient = '';

    switch(year) {
      case 'year1':
        yearName = 'الفرقة الأولى';
        bgColor = '#e6f7f5';
        headerGradient = 'linear-gradient(135deg, #00bfa5, #26c6da, #4dd0e1)';
        break;
      case 'year2':
        yearName = 'الفرقة الثانية';
        bgColor = '#e3f2fd';
        headerGradient = 'linear-gradient(135deg, #2196f3, #64b5f6, #90caf9)';
        break;
      case 'year3':
        yearName = 'الفرقة الثالثة';
        bgColor = '#f3e5f5';
        headerGradient = 'linear-gradient(135deg, #ab47bc, #ba68c8, #ce93d8)';
        break;
      case 'year4':
        yearName = 'الفرقة الرابعة';
        bgColor = '#fff3e0';
        headerGradient = 'linear-gradient(135deg, #ffb74d, #ffcc80, #ffe0b2)';
        break;
      default:
        yearName = 'قسم تكنولوجيا المعلومات';
        bgColor = '#e6f7f5';
        headerGradient = 'linear-gradient(135deg, #00bfa5, #26c6da, #4dd0e1)';
    }

    // تطبيق القيم
    document.body.style.setProperty('--bg-color', bgColor);
    document.body.style.setProperty('--header-gradient', headerGradient);
    yearLabel.textContent = yearName;

    // زر الرجوع
    function goBack() {
      window.location.href = 'dashboard.html';
    }
  </script>
  <footer>
    <p>© 2025 جامعة برج العرب التكنولوجية - قسم تكنولوجيا المعلومات</p>
    <p>تم انشاء هذا الموقع بواسطه Fatma Sabry Abdallah</p>
  </footer>
</body>
</html>
