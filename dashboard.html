<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة قسم تكنولوجيا المعلومات</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Cairo", sans-serif;
        text-align: center;
        color: #1e3a8a;
        background-color: var(--bg-color, #ffffff);
        transition: background-color 0.6s ease;
        overflow-x: hidden;
        animation: fadeIn 1s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      header {
        position: relative;
        background: var(
          --header-gradient,
          linear-gradient(135deg, #00bfa5, #26c6da, #4dd0e1)
        );
        color: #fff;
        padding: 25px 10px 35px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        transition: background 0.6s ease;
      }

      .back-btn {
        position: absolute;
        left: 15px;
        top: 15px;
        background-color: rgba(255, 255, 255, 0.15);
        border: none;
        color: white;
        font-size: 20px;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      }
      .back-btn:hover {
        background-color: rgba(255, 255, 255, 0.3);
        transform: scale(1.1);
      }

      .logos {
        display: flex;
        justify-content: center;
        gap: 20px;
      }
      .logos img {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 8px;
      }

      .welcome {
        font-size: 1.2rem;
        margin-top: 8px;
        color: #fff;
        opacity: 0.95;
      }
      .department-name {
        font-size: 1.5rem;
        font-weight: bold;
      }
      .year-label {
        font-size: 1.1rem;
        color: #fff;
        opacity: 0.9;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px 10px;
        gap: 25px;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        background: var(--card-bg, #c1f0ec);
        color: #1e3a8a;
        width: 90%;
        max-width: 320px;
        padding: 25px 20px;
        border-radius: 22px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        font-size: 18px;
        cursor: pointer;
        transition: transform 0.4s, box-shadow 0.4s, background 0.4s;
        text-decoration: none;
      }
      .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        background: var(
          --card-hover,
          linear-gradient(135deg, #80deea, #4db6ac)
        );
      }
      .card-icon {
        font-size: 40px;
        color: var(--icon-color, #009688);
      }
      .card p {
        font-size: 14px;
        color: #1e3a8a;
      }

      footer {
        padding: 20px;
        margin-top: 20px;
        background: var(
          --header-gradient,
          linear-gradient(135deg, #00bfa5, #26c6da, #4dd0e1)
        );
        color: white;
        font-size: 14px;
        box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.1);
      }

      @media (min-width: 700px) {
        .container {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>

      welcomeMsg.textContent = data.welcome;

      // تحديث الكروت ديناميكيًا
      const cardElements = document.querySelectorAll(".container .card");
      cardElements.forEach((card) => {
        const key = card.querySelector("h3").textContent.trim();
        switch (key) {
          case "منصة LMS":
            card.href = data.LMS.link;
            card.querySelector("p").textContent = data.LMS.text;
